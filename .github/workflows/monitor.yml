name: Avito monitor

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: avito-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Restore seen-list cache
        uses: actions/cache/restore@v4
        with:
          path: seen.json
          key: avito-seen-${{ github.run_id }}
          restore-keys: |
            avito-seen-

      - name: Check Avito and notify Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEARCH_URL: ${{ secrets.SEARCH_URL }}
          MAX_PRICE: "35000"
        run: python monitor.py

      - name: Save seen-list cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: seen.json
          key: avito-seen-${{ github.run_id }}

      - name: Upload debug screenshot on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: avito-debug-${{ github.run_id }}
          path: debug/
          if-no-files-found: ignore
          retention-days: 3

